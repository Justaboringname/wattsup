<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t">
<title id="t">WattsUp: load the CPU, memory, GPU and Neural Engine of an Apple Silicon Mac at once and log the watts. The peak preset reached 330.4 W whole-system (PSTR) on a Mac Studio M5 Max.</title>
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.tx { fill: #ecece8; }
.mu { fill: #9b9a94; }
.clay { fill: #d97757; }
.sage { fill: #9bb07c; }
.eyebrow { font-size: 22px; letter-spacing: 4px; }
.title { font-weight: 700; letter-spacing: -1.5px; }
.tag { font-size: 28px; }
.node { font-size: 24px; font-weight: 600; }
.sub { font-size: 22px; }
.cap { font-size: 22px; }
.small { font-size: 20px; }
.num { font-variant-numeric: tabular-nums; }
.big { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
</style>
<rect x="0.5" y="0.5" width="1279" height="419" rx="20" fill="#181818" stroke="#2f2f2f" stroke-width="1"/>
<text class="mono eyebrow mu" x="72" y="104">APPLE SILICON STRESS TEST</text>
<text class="sans title tx" x="68" y="190" style="font-size:76px">WattsUp</text>
<text class="sans tag mu" x="72" y="250">How many watts can a Mac burn?</text>
<text class="sans tag mu" x="72" y="290">Every unit at full load at once.</text>
<text class="sans tag mu" x="72" y="330">Power, heat and clocks, logged.</text>
